<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#120f1c">
    <title>Toy Claw</title>
    <!-- devcol.net analytics (game_start / page_leave automatically; the game sends stage_clear / game_over). 404 off-site, harmless. -->
    <script defer src="/t.js"></script>
    <link rel="icon" href="TemplateData/machine.png">
    <link rel="apple-touch-icon" href="TemplateData/machine.png">
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #120f1c; overflow: hidden; overscroll-behavior: none; }
      #unity-container { position: fixed; inset: 0; width: 100vw; height: 100dvh; background: #120f1c; }
      #unity-canvas { width: 100%; height: 100%; display: block; background: #120f1c; touch-action: none; outline: none; }
      #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
                 gap: 18px; background: radial-gradient(ellipse at 50% 40%, #2a2142 0%, #120f1c 70%); color: #fff;
                 font-family: -apple-system, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; transition: opacity .4s ease; z-index: 10; }
      #loading.done { opacity: 0; pointer-events: none; }
      #loading img { width: min(42vw, 220px); image-rendering: auto; filter: drop-shadow(0 12px 24px rgba(0,0,0,.45)); animation: bob 2.4s ease-in-out infinite; }
      @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-8px) } }
      #loading h1 { margin: 0; font-size: clamp(28px, 6vw, 44px); letter-spacing: .08em; font-weight: 900; color: #ffc63f; text-shadow: 0 3px 0 #7a4b00; }
      #bar { width: min(70vw, 360px); height: 14px; border-radius: 999px; background: rgba(255,255,255,.12); overflow: hidden; box-shadow: inset 0 2px 4px rgba(0,0,0,.4); }
      #bar > div { height: 100%; width: 0%; border-radius: 999px; background: linear-gradient(90deg, #ffc63f, #ff7a59); transition: width .15s linear; }
      #tip { font-size: 14px; opacity: .75; text-align: center; padding: 0 24px; line-height: 1.5; }
      #err { position: fixed; left: 12px; right: 12px; bottom: 12px; background: #b00020; color: #fff; padding: 10px 14px; border-radius: 8px; font: 14px sans-serif; display: none; z-index: 20; }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>
    <div id="loading">
      <img src="TemplateData/machine.png" alt="">
      <h1>TOY CLAW</h1>
      <div id="bar"><div id="bar-fill"></div></div>
      <div id="tip">버튼을 <b>꾹 누르면</b> 집게가 움직이고, <b>떼면</b> 멈춥니다.<br>두 번째 버튼을 떼는 순간 집게가 내려갑니다!</div>
    </div>
    <div id="err"></div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loading = document.querySelector("#loading");
      var barFill = document.querySelector("#bar-fill");
      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/WebGL.data.unityweb",
        frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb",
        codeUrl: buildUrl + "/WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        fullscreenElementID: "unity-container",
        companyName: "devcol",
        productName: "Toy Claw",
        productVersion: "0.1.0",
        autoSyncPersistentDataPath: true,
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
        showBanner: function (msg, type) {
          if (type !== 'error') return;
          var e = document.querySelector("#err"); e.textContent = msg; e.style.display = 'block';
        }
      };
      var script = document.createElement("script");
      script.src = buildUrl + "/WebGL.loader.js";
      script.onload = function () {
        createUnityInstance(canvas, config, function (p) { barFill.style.width = Math.round(p * 100) + "%"; })
          .then(function (instance) { window.toyClaw = instance; loading.classList.add("done"); canvas.focus(); })
          .catch(function (message) { config.showBanner(String(message), 'error'); });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
